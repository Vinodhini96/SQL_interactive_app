<style>

<div class="modal" id="hat"><div class="mbox"><div style="font-size:72px" id="hh">🎩</div><h2>The Sorting Hat</h2><p>Tell me your name, young wizard…</p><input id="nm" maxlength="24" placeholder="Your name" onkeydown="if(event.key=='Enter')sortMe()"><br><br><button class="cast" onclick="sortMe()">Sort me!</button><div class="cap" id="hr"></div></div></div>

<script>
const $=id=>document.getElementById(id)||document.createElement('div');
const T={cols:['id','name','house','year','pet'],rows:[[1,'Harry','Gryffindor',5,'Owl'],[2,'Hermione','Gryffindor',5,'Cat'],[3,'Ron','Gryffindor',5,'Rat'],[4,'Draco','Slytherin',5,'None'],[5,'Luna','Ravenclaw',4,'None'],[6,'Cedric','Hufflepuff',6,'None'],[7,'Neville','Gryffindor',5,'Toad'],[8,'Cho','Ravenclaw',6,'None'],[9,'Ginny','Gryffindor',4,'None'],[10,'Pansy','Slytherin',5,'Pug']]};
T.rows=T.rows.map(r=>Object.fromEntries(T.cols.map((c,i)=>[c,r[i]])));
const tb=(rows,cls='',cap='',st=[],t=T)=>`<table class="t ${cls}">${cap?`<caption>${cap}</caption>`:''}<tr>${t.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr class="${st[i]||''}">${t.cols.map(c=>`<td class="${r[c]==null?'nl':''}">${r[c]??'NULL'}</td>`).join('')}</tr>`).join('')}</table>`;

/* ---------- Engine (multi-table, DML, GROUP BY, aggregates) ---------- */
const DB={students:T,sweets:{cols:['id','item','category','price','qty'],rows:[]}};
DB.sweets.rows=[[1,'Chocolate Frog','Sweet',2,30],[2,"Bertie Bott's Beans",'Sweet',3,25],[3,'Pumpkin Juice','Drink',1,40],[4,'Cauldron Cake','Snack',2,15],[5,'Butterbeer','Drink',2,20],[6,'Licorice Wand','Sweet',1,35]].map(r=>Object.fromEntries(DB.sweets.cols.map((c,i)=>[c,r[i]])));
DB.marks={cols:['id','student','subject','score'],rows:[[1,'Harry','Potions',72],[2,'Hermione','Potions',98],[3,'Ron','Potions',null],[4,'Draco','Potions',85],[5,'Luna','Potions',null],[6,'Neville','Potions',60]].map(r=>Object.fromEntries(['id','student','subject','score'].map((c,i)=>[c,r[i]])))};
const mkr=(cols,a)=>a.map(r=>Object.fromEntries(cols.map((c,i)=>[c,r[i]])));
DB.wands={cols:['id','student_id','core','length'],rows:mkr(['id','student_id','core','length'],[[1,1,'Phoenix feather',11],[2,2,'Dragon heartstring',9],[3,3,'Unicorn hair',14],[4,4,'Unicorn hair',10],[5,5,'Thestral hair',12],[6,6,'Unicorn hair',12],[7,7,'Unicorn hair',13],[8,null,'Elder',15],[9,null,'Willow',10]])};
DB.houses={cols:['house','head','ghost'],rows:mkr(['house','head','ghost'],[['Gryffindor','McGonagall','Nearly Headless Nick'],['Slytherin','Snape','Bloody Baron'],['Ravenclaw','Flitwick','Grey Lady'],['Hufflepuff','Sprout','Fat Friar']])};
DB.crew={cols:['id','name','role','boss_id'],rows:mkr(['id','name','role','boss_id'],[[1,'Conductor','Boss',null],[2,'Engineer','Driver',1],[3,'Trolley Witch','Sales',1],[4,'Stoker','Coal',2]])};
DB.results={cols:['id','student','house','score'],rows:mkr(['id','student','house','score'],[[1,'Hermione','Gryffindor',98],[2,'Cho','Ravenclaw',95],[3,'Luna','Ravenclaw',95],[4,'Draco','Slytherin',90],[5,'Harry','Gryffindor',85],[6,'Cedric','Hufflepuff',85],[7,'Neville','Gryffindor',80],[8,'Ron','Gryffindor',70],[9,'Pansy','Slytherin',70],[10,'Ginny','Gryffindor',60]])};
DB.points={cols:['id','house','m','month','pts'],rows:mkr(['id','house','m','month','pts'],[[1,'Gryffindor',1,'Sep',40],[2,'Gryffindor',2,'Oct',55],[3,'Gryffindor',3,'Nov',30],[4,'Gryffindor',4,'Dec',70],[5,'Gryffindor',5,'Jan',65],[6,'Slytherin',1,'Sep',50],[7,'Slytherin',2,'Oct',45],[8,'Slytherin',3,'Nov',60],[9,'Slytherin',4,'Dec',40],[10,'Slytherin',5,'Jan',55]])};
const SEED=JSON.stringify({s:T.rows,w:DB.sweets.rows,m:DB.marks.rows,wd:DB.wands.rows,h:DB.houses.rows,c:DB.crew.rows,rs:DB.results.rows,pt:DB.points.rows});let snap=null;const LOG=[];
function reset(){const s=JSON.parse(SEED);T.rows=s.s;DB.sweets.rows=s.w;DB.marks.rows=s.m;DB.wands.rows=s.wd;DB.houses.rows=s.h;DB.crew.rows=s.c;DB.results.rows=s.rs;DB.points.rows=s.pt;snap=null;LOG.length=0;Object.keys(DB).forEach(k=>{if(!['students','sweets','marks','wands','houses','crew','results','points'].includes(k))delete DB[k]})}
const get=(r,c)=>{c=c.trim().toLowerCase();if(!(c in r))throw Error('I cannot find a column called "'+c+'".');return r[c]};
const tbl=n=>{n=n.toLowerCase();if(!DB[n])throw Error('There is no table called "'+n+'". Tables here: '+Object.keys(DB).join(', '));return DB[n]};
const lit=v=>{v=v.trim();return /^null$/i.test(v)?null:/^'.*'$/.test(v)?v.slice(1,-1):isNaN(v)?v:+v};
function test(wh,val){const ors=wh.split(/ or /i).map(o=>o.split(/ and /i).map(c=>{c=c.trim();const n=c.match(/^([\w()*.]+) is (not )?null$/i);if(n)return[n[1],n[2]?'notnull':'isnull','null'];const p=c.match(/^([\w()*.]+)(?: ?(>=|<=|<>|!=|=|>|<) ?| (like|not in|in) ?)(.+)$/i);if(!p)throw Error('Cannot understand condition: '+c);return[p[1],(p[2]||p[3]).toLowerCase(),p[4]]}));
 return x=>ors.some(a=>a.every(([c,op,v])=>{const l=val(x,c);if(op=='isnull')return l===null;if(op=='notnull')return l!==null;
  if(op=='in'||op=='not in'){const L=(v.replace(/^\s*\(|\)\s*$/g,'').match(/'[^']*'|[^,]+/g)||[]).map(lit);if(l===null)return false;if(op=='in')return L.includes(l);return !L.includes(null)&&!L.includes(l)}
  const rw=v.trim();if(/^[A-Za-z_]\w*(\.\w+)?$/.test(rw)&&!/^null$/i.test(rw)){try{v=val(x,rw)}catch(e){v=lit(rw)}}else v=lit(rw);if(l===null||v===null)return false;
  return op=='='?l===v:op=='!='||op=='<>'?l!==v:op=='>'?l>v:op=='<'?l<v:op=='>='?l>=v:op=='<='?l<=v:new RegExp('^'+String(v).replace(/%/g,'.*')+'$','i').test(l)}))}
const ev=(g,e)=>{e=e.trim();const m=e.match(/^(count|sum|avg|min|max)\((\*|[\w.]+)\)$/i);if(!m){if(!g.length)return null;const am=e.match(/^([\w.]+) ?([-+*\/]) ?([\w.]+)$/);if(am){const o=t=>isNaN(t)?get(g[0].r,t):+t,x=o(am[1]),y=o(am[3]);if(x===null||y===null)return null;return am[2]=='+'?x+y:am[2]=='-'?x-y:am[2]=='*'?x*y:y===0?null:Math.round(x/y*100)/100}return get(g[0].r,e)}const f=m[1].toLowerCase();if(f=='count'&&m[2]=='*')return g.length;
 const v=g.map(x=>get(x.r,m[2])).filter(x=>x!==null);if(f=='count')return v.length;if(!v.length)return null;const s=v.reduce((a,b)=>a+b,0);return f=='sum'?s:f=='avg'?Math.round(s/v.length*100)/100:f=='min'?v.reduce((a,b)=>a<b?a:b):v.reduce((a,b)=>a>b?a:b)};
function rsv(x,name){name=name.trim().toLowerCase();let a,c=name;if(name.includes('.'))[a,c]=name.split('.');for(const k in x){if((!a||a===k)&&x[k].r&&c in x[k].r)return x[k].r[c]}return null}
function fromJ(fr){const m=fr.match(/^(\w+)(?: (?!(?:inner|left|right|full|cross|join)\b)(?:as )?(\w+))?(.*)$/i);if(!m)throw Error('Bad FROM clause');
 const t0=tbl(m[1]),a0=(m[2]||m[1]).toLowerCase(),parts=[{a:a0,t:t0,n:m[1].toLowerCase()}];let rest=m[3],cb=t0.rows.map((r,i)=>({[a0]:{r,i}}));
 while(rest.trim()){const j=rest.match(/^ (?:(inner|left|right|full|cross) )?(?:outer )?join (\w+)(?: (?!on\b)(?:as )?(\w+))?(?: on ([\w.]+) ?= ?([\w.]+))?/i);if(!j)throw Error('I do not understand this JOIN. Try: … JOIN table ON a.col = b.col');
  rest=rest.slice(j[0].length);const ty=(j[1]||'inner').toLowerCase(),t1=tbl(j[2]),a1=(j[3]||j[2]).toLowerCase();if(ty!='cross'&&!j[4])throw Error('A JOIN needs an ON condition, e.g. ON s.id = w.student_id');
  parts.push({a:a1,t:t1,n:j[2].toLowerCase()});
  const ok=n=>{n=n.toLowerCase();return n.includes('.')?parts.some(p=>p.a==n.split('.')[0]&&p.t.cols.includes(n.split('.')[1])):parts.some(p=>p.t.cols.includes(n))};
  if(ty!='cross'&&!(ok(j[4])&&ok(j[5])))throw Error('I cannot find the columns in your ON condition: '+j[4]+' = '+j[5]);
  const nb=[],seen=new Set();
  cb.forEach(c=>{let hit=0;t1.rows.forEach((r,i)=>{const x={...c,[a1]:{r,i}};if(ty=='cross'||(rsv(x,j[4])!==null&&rsv(x,j[4])===rsv(x,j[5]))){nb.push(x);seen.add(i);hit=1}});if(!hit&&(ty=='left'||ty=='full'))nb.push({...c,[a1]:{r:null,i:null}})});
  if(ty=='right'||ty=='full')t1.rows.forEach((r,i)=>{if(!seen.has(i))nb.push({...Object.fromEntries(parts.slice(0,-1).map(p=>[p.a,{r:null,i:null}])),[a1]:{r,i}})});
  cb=nb}
 return{cb,parts}}
function expandSub(s){let g=0;while(g++<10){const i=s.search(/\(\s*select /i);if(i<0)break;let d=0,j=i;for(;j<s.length;j++){if(s[j]=='(')d++;else if(s[j]==')'){d--;if(!d)break}}if(d)throw Error('Unbalanced parentheses in your subquery.');
 const pre=s.slice(0,i),r=run(s.slice(i+1,j)),q=v=>v===null?'NULL':typeof v=='string'?"'"+v+"'":v;if(r.cols.length!=1)throw Error('A subquery here must return exactly ONE column.');let rep;
 if(/\b(not in|in) ?$/i.test(pre))rep='('+r.rows.map(x=>q(x[0])).join(', ')+')';
 else{if(r.rows.length>1)throw Error('The subquery returned '+r.rows.length+' rows but a single value is expected. Use IN instead of = / > / <.');rep=q(r.rows.length?r.rows[0][0]:null)}
 s=pre+rep+s.slice(j+1)}return s}

{t:'DISTINCT',spell:'Geminio Finite',story:'Professor: "Duplicates everywhere! DISTINCT banishes the copies."',steps:[

{t:'Data Warehousing',spell:'Portus',story:'Professor: "Data from many corners of the castle must travel to one great vault."',steps:[
 {h:'What is a data warehouse?',p:'A <span class="kw">data warehouse</span> is a central store that collects data from many systems (sales, web, CRM) and keeps <b>history</b> for analysis and reports. Day-to-day databases (OLTP) run the business; the warehouse (OLAP) helps you <b>understand</b> it.',v:()=>`<div class="flex" style="height:200px"><div>${['🗄️ Sales DB','📄 CSV files','🌐 Web logs'].map(s=>`<div class="box" style="margin:6px">${s}</div>`).join('')}</div><div style="position:relative;width:200px;height:40px">${[0,1,2].map(i=>`<span class="fly" style="top:0;animation-delay:${i*.9}s;--d:170px">✨</span>`).join('')}</div><div class="box"><div style="font-size:60px" class="pulse">🏛️</div>Data Warehouse</div></div>`},
 {h:'ETL: Extract → Transform → Load',p:'<b>Extract</b> raw data from sources, <b>Transform</b> it (clean, fix types, remove duplicates — hello DISTINCT!), then <b>Load</b> it into the warehouse.',v:()=>`<div class="flex">${[['📥','Extract','copy from sources'],['🧪','Transform','clean &amp; reshape'],['📦','Load','store in warehouse']].map(([e,a,b],i)=>`<div class="box pulse" style="animation-delay:${i*.4}s"><div style="font-size:40px">${e}</div><b>${a}</b><br><small>${b}</small></div>${i<2?'<div style="font-size:30px;color:var(--gold)">➜</div>':''}`).join('')}</div>`},
 {h:'Star schema',p:'Warehouses are often shaped like a <b>star</b>: a central <b>fact table</b> (measurable events, e.g. sales) surrounded by <b>dimension tables</b> (who, what, when, where).',v:()=>`<svg viewBox="0 0 500 250" width="100%" style="max-height:250px"><g stroke="#e8c46a" stroke-width="2" stroke-dasharray="6"><line x1="250" y1="125" x2="90" y2="40"/><line x1="250" y1="125" x2="410" y2="40"/><line x1="250" y1="125" x2="90" y2="210"/><line x1="250" y1="125" x2="410" y2="210"/><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></g>${[[250,125,'FACT: sales','#7f1d1d'],[90,40,'DIM: student','#1e3a8a'],[410,40,'DIM: product','#1e3a8a'],[90,210,'DIM: date','#1e3a8a'],[410,210,'DIM: house','#1e3a8a']].map(([x,y,t,c])=>`<rect x="${x-60}" y="${y-20}" width="120" height="40" rx="8" fill="${c}" stroke="#e8c46a"/><text x="${x}" y="${y+5}" fill="#fff" font-size="14" text-anchor="middle" font-family="Cinzel">${t}</text>`).join('')}</svg>`},
 {h:'OLTP vs OLAP',p:'Different jobs need different designs.',v:()=>cmp(0,'Database (OLTP)','Warehouse (OLAP)',[['Purpose','Run daily operations','Analyse &amp; report'],['Data','Current, detailed','Historical, summarised'],['Queries','Many small reads/writes','Few big, complex reads'],['Design','Normalised tables','Star / snowflake schema']])}]},
{t:'CREATE TABLE',spell:'Orchideous',story:`Conductor: "All aboard Platform 9¾! Every journey needs carriages — let us conjure a new one."`,steps:[

 {h:'Two ways to write it',p:`Naming the columns is safer — the order can't get mixed up, and skipped columns stay empty (NULL).`,v:()=>cmp(0,'Style','Example',[['All columns',"INSERT INTO students VALUES (11, 'Dean', 'Gryffindor', 5, 'None')"],['Named columns',"INSERT INTO students (id, name) VALUES (11, 'Dean')"]])}],

{t:'DELETE',spell:'Evanesco',story:`Conductor: "Passengers who leave must vanish from the register — carefully!"`,steps:[

{t:'COUNT, SUM, AVG',spell:'Numerus',story:`Trolley Witch: "Sweets for the journey! Let me tally up what I've sold, dears."`,steps:[
 {h:'Aggregate functions',p:`<b>Aggregate functions</b> squash many rows into <b>one answer</b>. <span class="kw">COUNT</span> counts rows, <span class="kw">SUM</span> adds up, <span class="kw">AVG</span> averages. Press a button and watch the trolley tally.`,v:()=>`<div class="flex">${tb(DB.sweets.rows,'','sweets (trolley)',[],DB.sweets).replace('<table','<table id="sw"')}<div class="box" style="min-width:230px;font-size:22px" id="av">Pick one ↓</div></div><div class="flex" style="margin-top:10px"><button class="cast" onclick="ag('count')">COUNT(*)</button><button class="cast" onclick="ag('sum')">SUM(qty)</button><button class="cast" onclick="ag('avg')">AVG(price)</button></div>`},

 q:{tbl:'sweets',task:'From <b>sweets</b>, show the <b>total quantity</b> (SUM of qty) and the <b>average price</b>.',ex:'SELECT COUNT(*) FROM sweets',ans:'SELECT SUM(qty), AVG(price) FROM sweets',hint:'SELECT SUM(qty), AVG(price) FROM sweets'}},
{t:'GROUP BY',spell:'Congrega',story:`Conductor: "Passengers, to your house carriages! Then we'll count each carriage."`,steps:[

{t:'HAVING',spell:"Inspector's Verdict",story:`Ticket Inspector: "Only carriages that meet the requirement may continue to the castle."`,steps:[
 {h:'Filtering groups',p:`<span class="kw">HAVING</span> filters <b>groups</b> after GROUP BY (WHERE filters rows <i>before</i>). Condition: <code>HAVING SUM(qty) &gt; 50</code>.`,v:()=>{const g=run('SELECT category, SUM(qty) FROM sweets GROUP BY category').rows;return`<div class="train">${g.map((x,i)=>car(x[0]+'<br>SUM(qty) = '+x[1],'🍬',['#7f1d1d','#1e3a8a','#854d0e'][i],'hv'+i)).join('')}<span style="font-size:44px">🛂</span></div><div class="rail"></div><div class="cap">SELECT category, SUM(qty) FROM sweets GROUP BY category HAVING SUM(qty) > 50</div>`},i:()=>run('SELECT category, SUM(qty) FROM sweets GROUP BY category').rows.forEach((x,i)=>setTimeout(()=>{$('hv'+i).classList.add(x[1]>50?'okc':'dim');chime(x[1]>50?1:0)},i*900+500))},
 {h:'WHERE vs HAVING & order of magic',p:`SQL reads your query in this order — that is why WHERE can't use COUNT() but HAVING can.`,v:()=>`<div class="flex">${['FROM','WHERE','GROUP BY','HAVING','SELECT','ORDER BY'].map((x,i)=>`<div class="box pulse" style="animation-delay:${i*.5}s">${i+1}<br><b>${x}</b></div>`).join('')}</div>`+cmp(0,'WHERE','HAVING',[['Filters','rows','groups'],['Runs','before GROUP BY','after GROUP BY'],['Aggregates?','No','Yes']])}],
 q:{tbl:'sweets',task:'From <b>sweets</b>, show each <b>category</b> and its total <b>qty</b>, but only categories whose total is <b>more than 50</b>.',ex:'SELECT category, COUNT(*) FROM sweets GROUP BY category',ans:'SELECT category, SUM(qty) FROM sweets GROUP BY category HAVING SUM(qty) > 50',hint:'… GROUP BY category HAVING SUM(qty) > 50'}},

 {h:'The WHERE discipline checklist',p:`Habits that protect your data:`,v:()=>cmp(0,'Habit','Why it matters',[['1 · Preview','SELECT … WHERE … first','You see exactly which rows will change'],['2 · Always WHERE','Never UPDATE / DELETE without it','No WHERE = every row is hit'],['3 · Read the message','"N row(s) updated"','If N is surprising, stop and ROLLBACK'],['4 · Use transactions','BEGIN … ROLLBACK','Test safely, then COMMIT when happy']])}],
 q:{task:'Promote all <b>year 4</b> students to <b>year 5</b> — touching nobody else.',ex:"UPDATE students SET pet = 'Owl' WHERE name = 'Luna'",hint:'UPDATE students SET year = 5 WHERE year = 4',chk:()=>T.rows.length==10&&T.rows.every(r=>r.year>=5)&&T.rows.filter(r=>r.year==6).length==2}},
{t:'Transactions',spell:'Tempus Retro',story:`Head Boy: "Made a terrible mistake? Plant a savepoint first — then you can turn back time."`,steps:[
 {h:'BEGIN → ROLLBACK',p:`A <b>transaction</b> groups statements into one all-or-nothing unit. <span class="kw">BEGIN</span> plants a savepoint, <span class="kw">COMMIT</span> makes changes permanent, <span class="kw">ROLLBACK</span> undoes them. Watch a disaster get reversed.`,v:()=>`<div class="flex">${tb(R6.slice(0,5),'','students')}</div><div class="cap" id="tc">…</div>`,i:()=>{const rows=()=>document.querySelectorAll('#stg tr');setTimeout(()=>{$('tc').textContent='BEGIN  🚩 savepoint planted';chime(1)},500);setTimeout(()=>{$('tc').textContent='DELETE FROM students   (oops — no WHERE!)';rows().forEach((r,k)=>k&&r.classList.add('gone'));chime(0)},2000);setTimeout(()=>{$('tc').textContent='ROLLBACK  ⏪ everything is back!';rows().forEach(r=>r.classList.remove('gone'));chime(3)},4200)}},

 q:{tbl:'sweets',task:'Find the <b>cheapest</b> and <b>most expensive</b> price on the trolley (MIN and MAX of price).',ex:'SELECT COUNT(*) FROM sweets',ans:'SELECT MIN(price), MAX(price) FROM sweets',hint:'SELECT MIN(price), MAX(price) FROM sweets'}},
{t:'GROUP BY Logic',spell:'Divide et Impera',story:`Trolley Witch: "To total each kind of treat, first sort them into baskets, then add up each basket."`,steps:[
 {h:'Split → Apply → Combine',p:`GROUP BY works in three moves: <b>split</b> rows into groups, <b>apply</b> the aggregate to each group, <b>combine</b> into one row per group. Watch <code>SUM(qty)</code> grow in each basket.`,v:()=>`<div id="pool" style="min-height:44px">${DB.sweets.rows.map((r,i)=>`<span class="hc" style="background:${HG[r.category]}" id="p${i}">${r.item} (${r.qty})</span>`).join('')}</div><div class="train" style="margin-top:10px">${Object.keys(HG).map(c=>car(c+' · SUM = <span class="n">0</span>','',HG[c],'gb-'+c)).join('')}</div><div class="rail"></div><div class="cap">SELECT category, SUM(qty) FROM sweets GROUP BY category</div>`,i:()=>DB.sweets.rows.forEach((r,i)=>setTimeout(()=>{const e=$('p'+i),c=$('gb-'+r.category);if(!e||!c.querySelector('.in'))return;e.remove();c.querySelector('.in').appendChild(e);c.querySelector('.n').textContent=+c.querySelector('.n').textContent+r.qty;chime(1)},i*700+400))},
 {h:'The rule of grouping',p:`Every column in SELECT must be <b>in GROUP BY</b> or <b>inside an aggregate</b>. Several aggregates per group are fine:`,v:()=>resT('SELECT category, COUNT(*), AVG(price), MAX(qty) FROM sweets GROUP BY category')}],
 q:{tbl:'sweets',task:'Show each <b>category</b> with its <b>average price</b>.',ex:'SELECT category, COUNT(*) FROM sweets GROUP BY category',ans:'SELECT category, AVG(price) FROM sweets GROUP BY category',hint:'SELECT category, AVG(price) FROM sweets GROUP BY category'}},
{t:'HAVING vs WHERE',spell:'Duo Filtrum',story:`Ticket Inspector: "Two checkpoints! One for individual passengers, one for whole carriages."`,steps:[
 {h:'Two filters, two moments',p:`<span class="kw">WHERE</span> filters <b>rows</b> before grouping; <span class="kw">HAVING</span> filters <b>groups</b> after. Watch the full pipeline.`,v:()=>`<div id="pool" style="min-height:44px">${DB.sweets.rows.map((r,i)=>`<span class="hc" style="background:${HG[r.category]}" id="s${i}">${r.item} (£${r.price})</span>`).join('')}</div><div class="train" style="margin-top:10px">${Object.keys(HG).map(c=>car(c+' · SUM = <span class="n">0</span>','',HG[c],'hg-'+c)).join('')}</div><div class="rail"></div><div class="cap" id="hc2">SELECT category, SUM(qty) FROM sweets WHERE price >= 2 GROUP BY category HAVING SUM(qty) > 30</div>`,i:()=>{const S=DB.sweets.rows,sm={};setTimeout(()=>{$('hc2').textContent='① WHERE price >= 2 → filters ROWS (before grouping)';S.forEach((r,k)=>{if(r.price<2)$('s'+k).classList.add('gone')});chime(0)},700);
  setTimeout(()=>{$('hc2').textContent='② GROUP BY category → builds GROUPS';S.forEach((r,k)=>{if(r.price>=2){const e=$('s'+k),c=$('hg-'+r.category);if(!c.querySelector('.in'))return;e.remove();c.querySelector('.in').appendChild(e);sm[r.category]=(sm[r.category]||0)+r.qty}});Object.keys(HG).forEach(c=>$('hg-'+c).querySelector('.n').textContent=sm[c]||0);chime(1)},2600);
  setTimeout(()=>{$('hc2').textContent='③ HAVING SUM(qty) > 30 → filters GROUPS';Object.keys(HG).forEach(c=>$('hg-'+c).classList.add((sm[c]||0)>30?'okc':'dim'));chime(3)},4800)}},
 {h:'Side by side',p:`If a condition uses an aggregate (SUM, COUNT…), it belongs in HAVING.`,v:()=>cmp(0,'WHERE','HAVING',[['Filters','rows','groups'],['Runs','before GROUP BY','after GROUP BY'],['Can use COUNT/SUM?','No','Yes'],['Example','price >= 2','SUM(qty) > 30']])}],
 q:{tbl:'sweets',task:'Use <b>both</b>: only sweets with <b>price ≥ 2</b>, grouped by <b>category</b>, showing <b>SUM(qty)</b>, keeping groups with total <b>&gt; 30</b>.',ex:'SELECT category, SUM(qty) FROM sweets WHERE price >= 2 GROUP BY category',ans:'SELECT category, SUM(qty) FROM sweets WHERE price >= 2 GROUP BY category HAVING SUM(qty) > 30',hint:'… WHERE price >= 2 GROUP BY category HAVING SUM(qty) > 30'}},
{t:'NULL Handling',spell:'Obscuro',story:`Professor: "NULL is not zero, not empty — it is <i>unknown</i>. Some marks were never recorded."`,steps:[
 {h:'What is NULL?',p:`<b>NULL</b> means "no value / unknown". It is not 0 and not ''. Because it is unknown, <code>= NULL</code> never matches — use <span class="kw">IS NULL</span>.`,v:()=>`<div class="flex">${tb(DB.marks.rows,'','marks',[],DB.marks)}</div><div class="flex" style="margin-top:10px;align-items:flex-start"><div><div class="cap">WHERE score = NULL ❌</div>${resT('SELECT student FROM marks WHERE score = NULL')}</div><div><div class="cap">WHERE score IS NULL ✅</div>${resT('SELECT student FROM marks WHERE score IS NULL')}</div></div>`},
 {h:'NULL and aggregates',p:`Aggregates <b>skip NULLs</b>. COUNT(*) counts rows; COUNT(score) counts only real scores; AVG divides by real scores only. Press each button — watch the NULL rows get skipped.`,v:()=>`<div class="flex">${tb(DB.marks.rows,'','marks',[],DB.marks).replace('<table','<table id="tl"')}<div class="box" style="min-width:250px;font-size:20px" id="av">Pick one ↓</div></div><div class="flex" style="margin-top:10px">${[['count','COUNT(*)'],['countc','COUNT(score)'],['sum','SUM(score)'],['avg','AVG(score)'],['min','MIN(score)'],['max','MAX(score)']].map(([f,l])=>`<button class="cast" onclick="tally('${f}','marks','score')">${l}</button>`).join('')}</div><div class="cap">AVG = 78.75 (4 real scores) — not 52.5, as if NULL were 0!</div>`}],
 q:{tbl:'marks',task:'Count how many marks are <b>missing</b> (NULL) in the <b>marks</b> table.',ex:'SELECT COUNT(score) FROM marks',ans:'SELECT COUNT(*) FROM marks WHERE score IS NULL',hint:'SELECT COUNT(*) FROM marks WHERE score IS NULL'}},
{t:'Why JOIN?',spell:'Homenum Revelio',story:`Marauder's Map: "I solemnly swear I am up to no good" — and the Map shows who is connected to whom. A JOIN does the same for tables.`,steps:[
 {h:'Facts live in different tables',p:`Each table stores one kind of thing. <code>wands.student_id</code> is a <span class="kw">foreign key</span> pointing at <code>students.id</code>. Follow the footprints and see how each wand finds its owner.`,v:()=>`<div class="flex" style="align-items:flex-start">${tb(DB.students.rows,'','students',[],DB.students)}${tb(DB.wands.rows,'','wands',[],DB.wands)}</div><div class="cap" id="pc">…</div>`,i:()=>pairUp()},
 {h:'Why not one giant table?',p:`Copying data everywhere wastes space and causes mistakes: if a head of house changes, you'd fix every student row. Store it <b>once</b> and JOIN when needed.`,v:()=>`<div class="flex" style="align-items:flex-start"><div><div class="cap">❌ One giant table</div>${resT('SELECT s.name, s.house, h.head FROM students s JOIN houses h ON s.house = h.house LIMIT 6')}<div class="cap bad">The head is repeated for every student!</div></div><div><div class="cap">✅ Split into two</div>${tb(DB.houses.rows,'','houses',[],DB.houses)}<div class="cap ok">Stored once — change it in one place</div></div></div>`},
 {h:'The family of joins',p:`Different joins answer different questions:`,v:()=>L3(['Keeps','Use when'],[['INNER','only matching rows','you need pairs that exist on both sides'],['LEFT','all left + matches','keep everyone on the left, even without a match'],['RIGHT','all right + matches','keep everything on the right'],['FULL','everything from both','spot gaps on either side'],['CROSS','every combination','all pairings (A × B)'],['SELF','a table joined to itself','hierarchies: employee → boss']])}]},
{t:'INNER JOIN',spell:'Duo Coniungo',story:`Map: "Only wizards who appear in BOTH places may pass."`,steps:[
 {h:'Matching pairs only',p:`<span class="kw">INNER JOIN</span> keeps only rows with a match on <b>both</b> sides. Green rows were used; the faded students have no wand, so they vanish from the result.`,v:()=>`<div class="flex">${venn('inner')}</div>`+jv('SELECT s.name, w.core FROM students s INNER JOIN wands w ON s.id = w.student_id')},
 {h:'Anatomy of a JOIN',p:`Use <b>aliases</b> (s, w) and <b>table.column</b> names so SQL knows which <code>id</code> you mean.`,v:()=>cmp(0,'Part','Meaning',[['FROM students s','left table, alias s'],['INNER JOIN wands w','right table, alias w'],['ON s.id = w.student_id','the matching rule: primary key = foreign key'],['s.name, w.core','table.column avoids ambiguity']])}],
 q:{tbls:['students','wands'],task:'Show each student\'s <b>name</b>, wand <b>core</b> and <b>length</b>, only for wands <b>longer than 11</b>.',ex:'SELECT s.name, w.core FROM students s INNER JOIN wands w ON s.id = w.student_id',ans:'SELECT s.name, w.core, w.length FROM students s INNER JOIN wands w ON s.id = w.student_id WHERE w.length > 11',hint:'… INNER JOIN wands w ON s.id = w.student_id WHERE w.length > 11'}},
{t:'LEFT JOIN',spell:'Sinistra',story:`Map: "Everyone on the left stays — even if nobody matches them."`,steps:[
 {h:'Keep every left row',p:`<span class="kw">LEFT JOIN</span> keeps <b>all</b> rows from the left table. Where there is no match, the right-hand columns become <span class="kw">NULL</span> (the shimmering gaps). Cho, Ginny and Pansy have no wand.`,v:()=>`<div class="flex">${venn('left')}</div>`+jv('SELECT s.name, w.core FROM students s LEFT JOIN wands w ON s.id = w.student_id')},
 {h:'The anti-join pattern',p:`LEFT JOIN + <code>WHERE right.key IS NULL</code> finds rows that have <b>no match</b>: "who is missing?". (Here: Gryffindors without a wand.)`,v:()=>`<div class="flex">${venn('anti')}</div>`+jv("SELECT s.name FROM students s LEFT JOIN wands w ON s.id = w.student_id WHERE w.id IS NULL AND s.house = 'Gryffindor'")}],
 q:{tbls:['students','wands'],task:'Find the <b>names</b> of <b>all students</b> who have <b>no wand</b>.',ex:'SELECT s.name, w.core FROM students s LEFT JOIN wands w ON s.id = w.student_id',ans:'SELECT s.name FROM students s LEFT JOIN wands w ON s.id = w.student_id WHERE w.id IS NULL',hint:'LEFT JOIN … WHERE w.id IS NULL'}},
{t:'RIGHT, FULL & Join Lab',spell:'Dextra Plena',story:`Map: "Now look from the other side — or from both at once."`,steps:[
 {h:'RIGHT JOIN',p:`<span class="kw">RIGHT JOIN</span> is a mirror of LEFT: keep <b>all wands</b>, even unsold ones (no owner). It is just LEFT JOIN with the tables swapped.`,v:()=>`<div class="flex">${venn('right')}</div>`+jv('SELECT s.name, w.core FROM students s RIGHT JOIN wands w ON s.id = w.student_id')},
 {h:'FULL OUTER JOIN',p:`<span class="kw">FULL OUTER JOIN</span> keeps <b>everything</b> from both sides; gaps become NULL. (MySQL lacks it — emulate with LEFT JOIN UNION RIGHT JOIN.)`,v:()=>`<div class="flex">${venn('full')}</div>`+jv('SELECT s.name, w.core FROM students s FULL OUTER JOIN wands w ON s.id = w.student_id')},
 {h:'🧪 Join Lab',p:`Same two tables, same condition — only the join type changes. Click each type and compare the Venn diagram, the green/faded source rows and the result.`,v:()=>`<div class="flex">${['inner','left','right','full'].map(t=>`<button class="cast" onclick="jl('${t}')">${t.toUpperCase()}</button>`).join('')}</div><div id="jl" style="margin-top:10px"></div>`,i:()=>jl('inner')}],
 q:{tbls:['students','wands'],task:'Using a <b>RIGHT JOIN</b>, list the <b>core</b> of wands that belong to <b>nobody</b> (unsold wands).',ex:'SELECT s.name, w.core FROM students s RIGHT JOIN wands w ON s.id = w.student_id',ans:'SELECT w.core FROM students s RIGHT JOIN wands w ON s.id = w.student_id WHERE s.id IS NULL',hint:'… RIGHT JOIN wands w ON s.id = w.student_id WHERE s.id IS NULL'}},
{t:'CROSS & SELF JOIN',spell:'Multiplicus',story:`Map: "Every wizard meets every other — or even meets themselves."`,steps:[
 {h:'CROSS JOIN: all combinations',p:`<span class="kw">CROSS JOIN</span> pairs <b>every</b> row of A with <b>every</b> row of B (no ON needed): 4 houses × 6 sweets = 24 rows. Useful for generating combinations — dangerous on big tables!`,v:()=>`<div class="flex" style="max-width:420px;margin:auto">${Array.from({length:24},(_,i)=>`<div style="width:34px;height:34px;border-radius:6px;background:${Object.values(HC)[Math.floor(i/6)]};border:1px solid var(--gold);animation:pop .4s both;animation-delay:${i*.08}s;font-size:11px;text-align:center;line-height:34px">${i+1}</div>`).join('')}</div><div class="cap">4 × 6 = 24 combinations</div>`+resT('SELECT h.house, s.item FROM houses h CROSS JOIN sweets s LIMIT 6')+'<div class="cap">first 6 of 24 rows</div>'},
 {h:'SELF JOIN: a table meets itself',p:`When a table references itself (<code>boss_id</code> → <code>id</code>), join it to itself using <b>two different aliases</b>: e = employee, b = boss.`,v:()=>`<div class="flex" style="align-items:flex-start">${tb(DB.crew.rows,'','crew',[],DB.crew)}<div style="font-size:30px;align-self:center">➜</div>${resT('SELECT e.name AS employee, b.name AS boss FROM crew e JOIN crew b ON e.boss_id = b.id')}</div><div class="cap">The Conductor has no boss (NULL), so the INNER JOIN drops them</div>`}],
 q:{tbls:['crew'],task:'Show each crew member\'s <b>name</b> next to their <b>boss\'s name</b> (self join on <code>boss_id = id</code>).',ex:'SELECT h.house, s.item FROM houses h CROSS JOIN sweets s LIMIT 5',ans:'SELECT e.name, b.name FROM crew e JOIN crew b ON e.boss_id = b.id',hint:'FROM crew e JOIN crew b ON e.boss_id = b.id'}},
{t:'JOIN + Aggregates',spell:'Fusio Maxima',story:`Map: "First connect the tables, then summarise the crowd."`,steps:[
 {h:'JOIN, then GROUP BY',p:`The order of work: <b>JOIN</b> builds one big virtual table → <b>WHERE</b> filters rows → <b>GROUP BY</b> makes groups → aggregates summarise each group.`,v:()=>jv('SELECT h.head, COUNT(*) FROM students s JOIN houses h ON s.house = h.house GROUP BY h.head')},
 {h:'Chaining three tables',p:`Add more <code>JOIN … ON …</code> clauses; each one attaches another table to the result so far.`,v:()=>resT('SELECT s.name, h.head, w.core FROM students s JOIN wands w ON s.id = w.student_id JOIN houses h ON s.house = h.house LIMIT 5')+'<div class="cap">students → wands → houses (first 5 rows)</div>'}],
 q:{tbls:['students','houses'],task:'For each house <b>head</b>, show the head and the <b>average year</b> of their students.',ex:'SELECT h.head, COUNT(*) FROM students s JOIN houses h ON s.house = h.house GROUP BY h.head',ans:'SELECT h.head, AVG(s.year) FROM students s JOIN houses h ON s.house = h.house GROUP BY h.head',hint:'SELECT h.head, AVG(s.year) … GROUP BY h.head'}},
{t:'Scalar Subqueries',spell:'Pensieve',story:`Professor: "A memory within a memory. The inner query is lifted out first — and its answer is poured into the outer one."`,steps:[
 {h:'Query inside a query',p:`A <span class="kw">subquery</span> is a SELECT inside parentheses. A <b>scalar</b> subquery returns <b>one value</b>, so you can use it with <code>= &gt; &lt;</code>. Watch the Pensieve at work.`,v:()=>`<pre class="code" id="pq">SELECT name FROM students WHERE year &gt; (<span id="pi">SELECT AVG(year) FROM students</span>)</pre><div class="cap" id="pb">…</div><div id="pr" style="margin-top:8px"></div>`,i:()=>{const v=run('SELECT AVG(year) FROM students').rows[0][0];setTimeout(()=>{$('pb').textContent='① The INNER query runs first…';$('pi').style.cssText='background:#e8c46a;color:#000;border-radius:4px;padding:0 4px';chime(1)},600);setTimeout(()=>{$('pb').textContent='② …and returns ONE value: '+v;chime(2)},2200);setTimeout(()=>{$('pi').textContent=v;$('pb').textContent='③ The OUTER query now runs as: WHERE year > '+v;chime(1)},3800);setTimeout(()=>{$('pr').innerHTML=resT('SELECT name FROM students WHERE year > (SELECT AVG(year) FROM students)');chime(3)},5200)}},
 {h:'Four shapes of subquery',p:`Where a subquery returns a value, a list or a table decides how you use it.`,v:()=>L3(['Returns','Used with','Example'],[['Scalar','one value','= &gt; &lt;','year &gt; (SELECT AVG(year) …)'],['List','one column, many rows','IN / NOT IN','id IN (SELECT …)'],['Table','rows + columns','FROM (SELECT …) t','derived table'],['Correlated','depends on the outer row','SELECT / WHERE','… WHERE w.student_id = s.id']])}],
 q:{task:'Find the <b>names</b> of students whose <b>year is above the average year</b> (use a subquery).',ex:'SELECT AVG(year) FROM students',ans:'SELECT name FROM students WHERE year > (SELECT AVG(year) FROM students)',hint:'WHERE year > (SELECT AVG(year) FROM students)'}},
{t:'IN & NOT IN',spell:'Inclusio',story:`Professor: "Sometimes the inner query hands back a whole list — a guest list for the outer query."`,steps:[
 {h:'IN with a list',p:`When the inner query returns a <b>column of values</b>, use <span class="kw">IN</span>. Step ①: the inner query makes a list of Gryffindor ids. Step ②: the outer query keeps wands whose owner is in that list.`,v:()=>`<pre class="code">SELECT core FROM wands WHERE student_id IN (<span id="iq">SELECT id FROM students WHERE house = 'Gryffindor'</span>)</pre><div class="flex" style="align-items:flex-start">${tb(DB.students.rows,'','students',[],DB.students).replace('<table','<table id="ts"')}${tb(DB.wands.rows,'','wands',[],DB.wands).replace('<table','<table id="tw"')}</div><div class="cap" id="ic2">…</div>`,i:()=>{const ids=run("SELECT id FROM students WHERE house = 'Gryffindor'").rows.map(x=>x[0]);setTimeout(()=>{$('ic2').textContent='① Inner query returns a LIST of ids: ('+ids.join(', ')+')';document.querySelectorAll('#ts tr').forEach((r,k)=>{if(k&&ids.includes(k))r.classList.add('keep')});$('iq').textContent=ids.join(', ');chime(1)},700);setTimeout(()=>{$('ic2').textContent='② The outer query keeps wands whose student_id is IN that list';document.querySelectorAll('#tw tr').forEach((r,k)=>{if(k)r.classList.add(ids.includes(DB.wands.rows[k-1].student_id)?'keep':'drop')});chime(3)},2600)}},
 {h:'⚠ The NOT IN / NULL trap',p:`<b>NOT IN</b> returns nothing if the list contains even one NULL (the unsold wands have <code>student_id = NULL</code>)! Always filter NULLs out, or use a LEFT JOIN anti-join.`,v:()=>`<div class="flex" style="align-items:flex-start"><div><div class="cap">NOT IN (SELECT student_id FROM wands)</div>${resT('SELECT name FROM students WHERE id NOT IN (SELECT student_id FROM wands)')}<div class="cap bad">😱 EMPTY — a NULL hides in the list</div></div><div><div class="cap">… WHERE student_id IS NOT NULL</div>${resT('SELECT name FROM students WHERE id NOT IN (SELECT student_id FROM wands WHERE student_id IS NOT NULL)')}<div class="cap ok">✅ Cho, Ginny, Pansy</div></div></div>`},
 {h:'Subquery or JOIN?',p:`Both can answer "students who own a wand". JOINs are usually faster and let you show columns from both tables; subqueries read like plain questions.`,v:()=>`<div class="flex" style="align-items:flex-start"><div><div class="cap">Subquery</div>${resT('SELECT name FROM students WHERE id IN (SELECT student_id FROM wands)')}</div><div><div class="cap">JOIN</div>${resT('SELECT s.name FROM students s JOIN wands w ON s.id = w.student_id')}</div></div>`+cmp(0,'Subquery','JOIN',[['Reads like','a question','a combined table'],['Columns from both tables?','No (only outer)','Yes'],['Best for','filters, one value, existence','combining details']])}],
 q:{task:'Using <b>IN with a subquery</b>, list the <b>names</b> of students who own a <b>Unicorn hair</b> wand.',ex:'SELECT student_id FROM wands',ans:"SELECT name FROM students WHERE id IN (SELECT student_id FROM wands WHERE core = 'Unicorn hair')",hint:"WHERE id IN (SELECT student_id FROM wands WHERE core = 'Unicorn hair')",tbls:['students','wands']}},
{t:'Advanced Subqueries',spell:'Recursio',story:`Professor: "Some subqueries are cleverer: they re-run for every row, or build a temporary table. Watch carefully."`,steps:[
 {h:'Correlated subquery',p:`A <b>correlated</b> subquery refers to the outer row (<code>s.id</code>), so it <b>re-runs for every outer row</b> — like a messenger visiting each student in turn.`,v:()=>`<table id="cr"><tr><th>id</th><th>name</th><th>wands owned ← inner query</th></tr>${DB.students.rows.map(r=>`<tr><td>${r.id}</td><td>${r.name}</td><td>?</td></tr>`).join('')}</table><div class="cap" id="cc">SELECT name, (SELECT COUNT(*) FROM wands w WHERE w.student_id = s.id) FROM students s</div>`,i:()=>{const rows=document.querySelectorAll('#cr tr');DB.students.rows.forEach((s,k)=>setTimeout(()=>{rows.forEach(r=>r.classList.remove('scan'));rows[k+1].classList.add('scan');const n=DB.wands.rows.filter(w=>w.student_id==s.id).length;rows[k+1].children[2].textContent=n;$('cc').textContent='Inner query re-runs for '+s.name+': COUNT of wands where student_id = '+s.id+' → '+n;chime(1)},k*800+400))}},
 {h:'Derived table (subquery in FROM)',p:`A subquery in <code>FROM</code> builds a <b>temporary table</b> that the outer query treats like any other table. It needs an alias (<code>t</code>).`,v:()=>`<pre class="code">SELECT house, avg_year FROM (<span>SELECT house, AVG(year) AS avg_year FROM students GROUP BY house</span>) t WHERE avg_year &gt; 4.9</pre><div id="dr" style="margin-top:8px"></div><div class="cap" id="dc2">…</div>`,i:()=>{setTimeout(()=>{$('dc2').textContent='① The inner query builds a temporary table "t"';$('dr').innerHTML=resT('SELECT house, AVG(year) AS avg_year FROM students GROUP BY house');chime(1)},600);setTimeout(()=>{$('dc2').textContent='② The outer query filters t: avg_year > 4.9';const r=run('SELECT house, AVG(year) AS avg_year FROM students GROUP BY house');$('dr').innerHTML=rt({cols:r.cols,rows:r.rows.filter(x=>x[1]>4.9)});chime(3)},3000)}},
 {h:'EXISTS & choosing wisely',p:`<span class="kw">EXISTS (subquery)</span> is true if the inner query returns <b>any</b> row — perfect for "does a match exist?" checks, and it avoids the NOT IN NULL trap.`,v:()=>L3(['Question','Best tool'],[['One value to compare','scalar subquery'],['Is it in this list?','IN (subquery)'],['Is there ANY match?','EXISTS / NOT EXISTS'],['Need columns from both','JOIN'],['Summarise first, then filter','derived table (FROM subquery)'],['Who has no match?','LEFT JOIN … IS NULL']])}]},
{t:'CTEs: WITH Clause',spell:'Fiola Nomen',story:`Potions Master: "A good brewer labels every bottle. A CTE is a labelled bottle for a query result."`,steps:[
 {h:'A named, temporary result',p:`A <span class="kw">CTE</span> (Common Table Expression) gives a query result a <b>name</b>, so the main query can use it like a table. It exists only for that one statement. Watch the bottle get filled, then used.`,v:()=>CODE(`<span id="cc1">WITH strong AS (SELECT * FROM results WHERE score &gt;= 85)</span>\n<span id="cc2">SELECT AVG(score) FROM strong</span>`)+`<div class="cap" id="ccap">…</div><div class="flex" style="align-items:flex-start"><div id="cb"></div><div id="cr2"></div></div>`,i:()=>{const r=run('WITH strong AS (SELECT * FROM results WHERE score >= 85) SELECT AVG(score) FROM strong'),bt=hcol(tb(DB.strong.rows,'','🧪 strong',[],DB.strong)),hl=id=>{$(id).style.cssText='background:#e8c46a;color:#000;border-radius:4px'};
  setTimeout(()=>{hl('cc1');$('ccap').textContent='① The CTE runs first and is stored as a temporary, NAMED result — a labelled bottle 🧪 called "strong"';$('cb').innerHTML=bt;chime(1)},700);
  setTimeout(()=>{$('cc1').style.cssText='';hl('cc2');$('ccap').textContent='② The main query just reads FROM strong, as if it were a real table';$('cr2').innerHTML=rt(r);chime(3)},3800)}},
 {h:'Syntax, piece by piece',p:`Read it top to bottom. Several CTEs are separated by commas, and later ones may use earlier ones.`,v:()=>CODE(`WITH strong AS (            ${GR('-- ① WITH name AS (')}\n  SELECT * FROM results\n  WHERE score &gt;= 85       ${GR('-- ② the query that fills the bottle')}\n)                           ${GR('-- ③ close the bracket')}\nSELECT AVG(score)\nFROM strong;                ${GR('-- ④ main query uses the name')}`)+L3(['Written as','Meaning'],[['WITH','WITH strong AS','start a CTE and name it'],['( … )','(SELECT …)','the query whose result gets that name'],['Main query','SELECT … FROM strong','uses the name like a table'],['More CTEs',', second AS (SELECT …)','comma-separated; can build on earlier ones']])},
 {h:'When to reach for a CTE',p:`CTEs turn one tangled query into small, named steps.`,v:()=>L3(['Situation','Why a CTE helps'],[['Readability','name each step instead of nesting queries inside queries'],['Reuse','refer to the same result several times in one statement'],['Step-by-step logic','build the answer in stages: filter → summarise → compare'],['Window results','you cannot filter on a window function in WHERE — compute it in a CTE, then filter'],['Hierarchies','recursive CTEs walk trees (next chapter)']])}],
 q:{tbls:['results'],task:'Create a CTE named <b>strong</b> (students with <b>score ≥ 85</b>) and use it to show their <b>average score</b>.',ex:'WITH top AS (SELECT * FROM results WHERE score >= 95) SELECT student FROM top',ans:'WITH strong AS (SELECT * FROM results WHERE score >= 85) SELECT AVG(score) FROM strong',hint:'WITH strong AS (SELECT * FROM results WHERE score >= 85) SELECT AVG(score) FROM strong'}},
{t:'Recursive CTEs',spell:'Repetitio',story:`Professor: "Some questions repeat themselves: who is the boss's boss's boss? A recursive CTE keeps asking until the answer runs out."`,steps:[
 {h:'Anchor + repeat until done',p:`A <span class="kw">recursive CTE</span> has two parts joined by <code>UNION ALL</code>: the <b>anchor</b> (where to start) and the <b>recursive step</b> (how to find the next layer using the rows found so far). It stops when a round finds nothing new. Watch it climb the train crew's chain of command.`,v:()=>CODE(`WITH RECURSIVE chain AS (\n  SELECT id, name, 0 AS level FROM crew WHERE boss_id IS NULL   ${GR('-- ① ANCHOR: start at the top')}\n  UNION ALL\n  SELECT c.id, c.name, ch.level + 1\n  FROM crew c JOIN chain ch ON c.boss_id = ch.id                ${GR('-- ② RECURSIVE STEP')}\n)\nSELECT * FROM chain;`)+`<div class="flex" style="align-items:flex-start"><table id="rt1"><caption>chain (grows each round)</caption><tr><th>id</th><th>name</th><th>level</th></tr></table><div id="rtree" style="font-size:17px;min-width:200px"></div></div><div class="cap" id="rcap">…</div>`,i:()=>{const C=DB.crew.rows;let cur=C.filter(x=>x.boss_id===null),lv=0;const rounds=[];while(cur.length){rounds.push(cur.map(x=>({...x,lv})));const ids=cur.map(x=>x.id);cur=C.filter(x=>ids.includes(x.boss_id));lv++}
  rounds.forEach((rd,k)=>setTimeout(()=>{rd.forEach(x=>{$('rt1').insertAdjacentHTML('beforeend',`<tr class="pop"><td>${x.id}</td><td>${x.name}</td><td>${x.lv}</td></tr>`);$('rtree').insertAdjacentHTML('beforeend',`<div class="pop" style="margin-left:${x.lv*28}px;animation:pop .4s both">${x.lv?'└ ':''}👤 ${x.name}</div>`)});
   $('rcap').textContent=k==0?'① ANCHOR: the row(s) with no boss → '+rd.map(x=>x.name).join(', '):'② Round '+k+': crew whose boss_id is in the previous round → '+rd.map(x=>x.name).join(', ');chime(1)},k*2400+700));
  setTimeout(()=>{$('rcap').textContent='Round '+rounds.length+' finds nobody new → recursion STOPS. The CTE now holds all '+C.length+' rows.';chime(3)},rounds.length*2400+700)}},
 {h:'The simplest recursion: counting',p:`Same two parts, minimal data. The <b>WHERE x &lt; 5</b> is the <b>stop condition</b>. Try removing it!`,v:()=>CODE(`WITH RECURSIVE n(x) AS (\n  SELECT 1                       ${GR('-- anchor: start at 1')}\n  UNION ALL\n  SELECT x + 1 FROM n WHERE x &lt; 5   ${GR('-- step + STOP condition')}\n)\nSELECT x FROM n;`)+`<div class="flex" id="nb" style="min-height:70px"></div><div class="cap" id="ncap">…</div><div class="flex"><button class="ghost" onclick="rec(1)">▶ Run with stop condition</button><button class="ghost" onclick="rec(0)">☠ Remove the stop condition</button></div>`,i:()=>rec(1)},
 {h:'Uses and safety rules',p:`Recursive CTEs shine on anything shaped like a tree or a chain. (This sandbox explains them visually; run them for real in SQLite, PostgreSQL or MySQL 8+.)`,v:()=>L3(['Use it for','Example'],[['Org charts','employee → manager → director'],['Folder trees','every file under a folder'],['Bill of materials','parts inside parts'],['Number / date series','1…100, every day of a month'],['Paths in graphs','routes between stations']])+`<div class="cap">Safety: always include a stop condition · prefer UNION ALL · most databases cap recursion depth</div>`}]},
{t:'Window Functions: Big Idea',spell:'Fenestra',story:`Divination Professor: "GROUP BY takes a class photo — individuals vanish. A window function lets everyone keep their desk and adds a note about the group."`,steps:[
 {h:'GROUP BY collapses, OVER keeps',p:`<b>Aggregates</b> with GROUP BY squash rows into one per group. A <span class="kw">window function</span> (<code>… OVER (…)</code>) calculates over a group of rows but <b>keeps every row</b>.`,v:()=>`<div class="flex" style="align-items:flex-start"><div><div class="cap">GROUP BY → class photo 📸</div>${rq('SELECT house, AVG(score) FROM results GROUP BY house')}<div class="cap">one row per house; students vanish</div></div><div><div class="cap">OVER → sticky notes 📝</div>${rq('SELECT student, house, score, AVG(score) OVER (PARTITION BY house) AS house_avg FROM results')}<div class="cap">everyone keeps their desk + a note</div></div></div>`},
 {h:'Anatomy of OVER',p:`Four parts. Click each to see what it does. Analogy: <b>PARTITION BY</b> = split into common rooms · <b>ORDER BY</b> = line up inside each room · <b>FRAME</b> = which neighbours you can see.`,v:()=>`<pre class="code" id="an0"><span>SUM(score)</span> OVER (<span>PARTITION BY house</span> <span>ORDER BY score DESC</span> <span>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</span>)</pre><div class="flex">${['① Function','② PARTITION BY','③ ORDER BY','④ Frame'].map((x,k)=>`<button class="ghost" onclick="anat(${k})">${x}</button>`).join('')}</div><div class="box" id="an1" style="margin-top:10px;text-align:left">Click a part…</div>`},
 {h:'🧪 Window Builder',p:`Switch parts on and off and watch the same table change. Try <b>RANK</b> with PARTITION BY on, then <b>SUM</b> with ORDER BY on and off.`,v:()=>`<div class="flex"><button class="ghost" id="wbp" onclick="wbs('p')"></button><button class="ghost" id="wbo" onclick="wbs('o')"></button></div><div class="flex">${['ROW_NUMBER()','RANK()','SUM(score)','AVG(score)','COUNT(*)'].map(f=>`<button class="cast" onclick="wbf('${f}')">${f}</button>`).join('')}</div><pre class="code" id="wq"></pre><div id="wr"></div>`,i:()=>{wb={p:0,o:1,f:'ROW_NUMBER()'};wbr()}}],
 q:{tbls:['results'],task:'Show each <b>student</b>, their <b>score</b> and the <b>overall average score</b> on every row (use <code>AVG(score) OVER ()</code>).',ex:'SELECT student, score, SUM(score) OVER () AS total FROM results',ans:'SELECT student, score, AVG(score) OVER () AS avg_all FROM results',hint:'SELECT student, score, AVG(score) OVER () AS avg_all FROM results'}},
{t:'ROW_NUMBER RANK DENSE_RANK',spell:'Ordo Victoriae',story:`Triwizard Judge: "Everyone gets a place — but what happens when two competitors tie?"`,steps:[
 {h:'The podium reveal',p:`Three ranking functions number rows in score order. They only differ <b>when scores tie</b>. Watch the table fill in; tied rows light up.`,v:()=>`<div class="flex"><table id="rk"><tr><th>student</th><th>score</th><th>ROW_NUMBER</th><th>RANK</th><th>DENSE_RANK</th></tr></table></div><div class="cap" id="rkc">…</div>`,i:()=>{const r=run('SELECT student, score, ROW_NUMBER() OVER (ORDER BY score DESC) AS a, RANK() OVER (ORDER BY score DESC) AS b, DENSE_RANK() OVER (ORDER BY score DESC) AS c FROM results').rows;
  r.forEach((x,k)=>setTimeout(()=>{const tie=(r[k-1]&&r[k-1][1]==x[1])||(r[k+1]&&r[k+1][1]==x[1]);$('rk').insertAdjacentHTML('beforeend',`<tr class="pop" ${tie?'style="background:#e8c46a44"':''}>${x.map(v=>`<td>${v}</td>`).join('')}</tr>`);
   $('rkc').textContent=r[k-1]&&r[k-1][1]==x[1]?`TIE at ${x[1]}! ROW_NUMBER still counts 1,2,3… · RANK gives both ${x[3]} and SKIPS the next number · DENSE_RANK gives both ${x[4]} with NO gap`:`${x[0]}: place ${x[3]} (RANK) / ${x[4]} (DENSE_RANK)`;chime(1)},k*1000+400))}},
 {h:'Olympic medals analogy',p:`Two silver medallists. <b>RANK</b>: next athlete is 4th — nobody gets bronze. <b>DENSE_RANK</b>: next athlete is 3rd — bronze is awarded. <b>ROW_NUMBER</b>: never ties, it just numbers rows (the order among ties is arbitrary).`,v:()=>{const box=(e,n,t,c)=>`<div class="box" style="min-width:110px;background:${c||'#1b1538'}"><div style="font-size:28px">${e}</div>${n}<br><b>${t}</b></div>`;return `<div class="cap">RANK()</div><div class="flex">${box('🥇','Hermione','1')}${box('🥈','Cho','2')}${box('🥈','Luna','2')}${box('😐','Draco','4 (3 skipped!)','#3b1a1a')}</div><div class="cap" style="margin-top:14px">DENSE_RANK()</div><div class="flex">${box('🥇','Hermione','1')}${box('🥈','Cho','2')}${box('🥈','Luna','2')}${box('🥉','Draco','3','#14321e')}</div>`}},
 {h:'PARTITION BY: rank inside each house',p:`Add <code>PARTITION BY house</code> and the numbering <b>restarts</b> in every house — ideal for "best in each group".`,v:()=>rq('SELECT student, house, score, ROW_NUMBER() OVER (PARTITION BY house ORDER BY score DESC) AS pos FROM results ORDER BY house')+'<div class="cap">pos = 1 → the top student of each house</div>'}],
 q:{tbls:['results'],task:'Rank students by <b>score</b> (highest first) with <b>DENSE_RANK()</b>; show student, score and the rank.',ex:'SELECT student, score, RANK() OVER (ORDER BY score DESC) AS r FROM results',ans:'SELECT student, score, DENSE_RANK() OVER (ORDER BY score DESC) AS r FROM results',hint:'DENSE_RANK() OVER (ORDER BY score DESC)'}},
{t:'LEAD & LAG',spell:'Retro Prospectus',story:`Time-Turner Guide: "LAG glances at the footprint behind you; LEAD peeks at the one ahead."`,steps:[
 {h:'Looking behind and ahead',p:`<span class="kw">LAG(col)</span> reads the value from the <b>previous row</b>, <span class="kw">LEAD(col)</span> from the <b>next row</b> (in the ORDER BY order). Watch Gryffindor's monthly points: green = previous row, blue = next row, gold = current.`,v:()=>`<div class="flex"><table id="ll"><tr><th>month</th><th>pts</th><th>LAG(pts)</th><th>LEAD(pts)</th><th>pts − LAG</th></tr>${DB.points.rows.filter(r=>r.house=='Gryffindor').map(r=>`<tr><td>${r.month}</td><td>${r.pts}</td><td>?</td><td>?</td><td>?</td></tr>`).join('')}</table></div><div class="cap" id="llc">LAG(pts) OVER (ORDER BY m) · LEAD(pts) OVER (ORDER BY m)</div>`,i:()=>{const R=DB.points.rows.filter(r=>r.house=='Gryffindor'),tr=[...document.querySelectorAll('#ll tr')].slice(1);
  R.forEach((r,k)=>setTimeout(()=>{tr.forEach(t=>{t.classList.remove('scan','keep');t.style.background=''});tr[k].classList.add('scan');if(k>0)tr[k-1].classList.add('keep');if(k<R.length-1)tr[k+1].style.background='#3b82f655';
   const pv=k?R[k-1].pts:null,nx=k<R.length-1?R[k+1].pts:null;tr[k].children[2].textContent=pv??'NULL';tr[k].children[3].textContent=nx??'NULL';tr[k].children[4].textContent=pv===null?'NULL':r.pts-pv;
   $('llc').textContent=`${r.month}: LAG = ${pv??'NULL (no row before!)'} · LEAD = ${nx??'NULL (no row after!)'}`;chime(1)},k*1300+500))}},
 {h:'Month-over-month change',p:`Compare each row with the previous one: compute LAG in a <b>CTE</b>, then do the maths. The first month of each house has no previous row, so its change is NULL.`,v:()=>CODE(`WITH t AS (\n  SELECT house, month, pts,\n         LAG(pts) OVER (PARTITION BY house ORDER BY m) AS prev\n  FROM points\n)\nSELECT house, month, pts, prev, pts - prev AS change FROM t;`)+rq('WITH t AS (SELECT house, month, pts, LAG(pts) OVER (PARTITION BY house ORDER BY m) AS prev FROM points) SELECT house, month, pts, prev, pts - prev AS change FROM t')},
 {h:'Offsets and default values',p:`<code>LAG(col, offset, default)</code>: look <b>offset</b> rows back (default 1) and use <b>default</b> instead of NULL when there is no such row.`,v:()=>`<div class="flex" style="align-items:flex-start"><div><div class="cap">LAG(pts)</div>${resT("SELECT month, LAG(pts) OVER (ORDER BY m) AS prev FROM points WHERE house = 'Slytherin'")}</div><div><div class="cap">LAG(pts, 1, 0)</div>${resT("SELECT month, LAG(pts, 1, 0) OVER (ORDER BY m) AS prev FROM points WHERE house = 'Slytherin'")}</div><div><div class="cap">LEAD(pts, 2)</div>${resT("SELECT month, LEAD(pts, 2) OVER (ORDER BY m) AS two_ahead FROM points WHERE house = 'Slytherin'")}</div></div>`}],
 q:{tbls:['points'],task:'For <b>Slytherin</b>, show <b>month</b>, <b>pts</b> and the <b>previous month\'s pts</b> (LAG) ordered by <code>m</code>.',ex:"SELECT month, pts, LEAD(pts) OVER (ORDER BY m) AS nxt FROM points WHERE house = 'Slytherin'",ans:"SELECT month, pts, LAG(pts) OVER (ORDER BY m) AS prev FROM points WHERE house = 'Slytherin'",hint:"LAG(pts) OVER (ORDER BY m) … WHERE house = 'Slytherin'"}},
{t:'SUM() OVER (PARTITION BY)',spell:'Cumulus',story:`Triwizard Judge: "Points snowball: every round adds to what came before."`,steps:[
 {h:'The snowball: running total',p:`<code>SUM(pts) OVER (PARTITION BY house ORDER BY m)</code>: restart for each house, and add up from the first month to the <b>current row</b>. Green rows are the window the sum can see.`,v:()=>`<div class="flex"><table id="sn"><tr><th>house</th><th>month</th><th>pts</th><th>running total</th><th></th></tr>${DB.points.rows.map(r=>`<tr><td>${r.house}</td><td>${r.month}</td><td>${r.pts}</td><td>?</td><td></td></tr>`).join('')}</table></div><div class="cap" id="snc">…</div>`,i:()=>{const R=DB.points.rows,tr=[...document.querySelectorAll('#sn tr')].slice(1);let tot={};
  R.forEach((r,k)=>setTimeout(()=>{tot[r.house]=(tot[r.house]||0)+r.pts;tr.forEach((t,j)=>{t.classList.remove('scan','keep');if(R[j].house==r.house&&j<k)t.classList.add('keep')});tr[k].classList.add('scan');tr[k].children[3].textContent=tot[r.house];tr[k].children[4].innerHTML=`<div style="height:10px;background:linear-gradient(90deg,#e8c46a,#b8860b);width:${tot[r.house]/3}px;border-radius:5px"></div>`;
   $('snc').textContent=`${r.house}, ${r.month}: ${tot[r.house]-r.pts} so far + ${r.pts} = ${tot[r.house]} (the total restarts for each house)`;chime(1)},k*800+400))}},
 {h:'Group total vs running total',p:`<b>Without</b> ORDER BY every row sees the whole room, so each row shows the same total. <b>With</b> ORDER BY the window grows row by row.`,v:()=>`<div class="flex" style="align-items:flex-start"><div><div class="cap">OVER (PARTITION BY house)</div>${rq("SELECT house, month, pts, SUM(pts) OVER (PARTITION BY house) AS total FROM points WHERE house = 'Gryffindor'")}</div><div><div class="cap">OVER (PARTITION BY house ORDER BY m)</div>${rq("SELECT house, month, pts, SUM(pts) OVER (PARTITION BY house ORDER BY m) AS running FROM points WHERE house = 'Gryffindor'")}</div></div>`},
 {h:'Sliding frames: moving average',p:`A <b>frame</b> limits how far the window sees. <code>ROWS BETWEEN 1 PRECEDING AND CURRENT ROW</code> = this row and the one before: a 2-month moving average.`,v:()=>`<div class="flex"><table id="mv"><tr><th>month</th><th>pts</th><th>moving avg (2 rows)</th></tr>${DB.points.rows.filter(r=>r.house=='Gryffindor').map(r=>`<tr><td>${r.month}</td><td>${r.pts}</td><td>?</td></tr>`).join('')}</table></div><div class="cap" id="mvc">AVG(pts) OVER (ORDER BY m ROWS BETWEEN 1 PRECEDING AND CURRENT ROW)</div>`,i:()=>{const rs=run("SELECT month, pts, AVG(pts) OVER (ORDER BY m ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) AS mv FROM points WHERE house = 'Gryffindor'").rows,tr=[...document.querySelectorAll('#mv tr')].slice(1);
  rs.forEach((x,k)=>setTimeout(()=>{tr.forEach(t=>t.classList.remove('scan','keep'));tr[k].classList.add('scan');if(k)tr[k-1].classList.add('keep');tr[k].children[2].textContent=x[2];$('mvc').textContent=k?`Window = ${rs[k-1][1]} and ${x[1]} → average ${x[2]}`:`Window = just ${x[1]} (nothing before it) → ${x[2]}`;chime(1)},k*1200+500))}}],
 q:{tbls:['points'],task:'For <b>each house</b>, show house, month, pts and the <b>running total</b> of pts (ordered by <code>m</code>, restarting per house).',ex:"SELECT house, month, SUM(pts) OVER (PARTITION BY house) AS total FROM points",ans:'SELECT house, month, pts, SUM(pts) OVER (PARTITION BY house ORDER BY m) AS running FROM points',hint:'SUM(pts) OVER (PARTITION BY house ORDER BY m)'}},
{t:'NTILE Buckets',spell:'Quartus',story:`Sorting Hat: "Sometimes I deal students into equal-sized piles — top quarter, next quarter…"`,steps:[
 {h:'Dealing into buckets',p:`<span class="kw">NTILE(n)</span> sorts rows and deals them into <b>n buckets of (nearly) equal size</b>: NTILE(4) = quartiles. Watch the hat deal students (best first) into 4 buckets.`,v:()=>{const R=DB.results.rows;return `<div id="pool" style="min-height:44px">${R.map((r,k)=>`<span class="hc" id="nt${k}" style="background:#334">${r.student} ${r.score}</span>`).join('')}</div><div class="train" style="margin-top:10px">${[1,2,3,4].map(b=>car('Bucket '+b+' · <span class="n">0</span>','',['#14532d','#1e3a8a','#854d0e','#7f1d1d'][b-1],'bk'+b)).join('')}</div><div class="rail"></div><div class="cap">NTILE(4) OVER (ORDER BY score DESC)</div>`},i:()=>run('SELECT student, score, NTILE(4) OVER (ORDER BY score DESC) AS b FROM results').rows.forEach((x,k)=>setTimeout(()=>{const e=$('nt'+k),c=$('bk'+x[2]);if(!e||!c.querySelector('.in'))return;e.remove();c.querySelector('.in').appendChild(e);c.querySelector('.n').textContent=c.querySelectorAll('.hc').length;chime(1)},k*650+400))},
 {h:'Uneven sizes and ties',p:`10 rows ÷ 4 buckets = 2 remainder 2 → the <b>first buckets get the extra rows</b> (3, 3, 2, 2). Ties are <b>not</b> kept together: Ron and Pansy both scored 70 but land in different buckets.`,v:()=>rq('SELECT student, score, NTILE(4) OVER (ORDER BY score DESC) AS bucket FROM results')},
 {h:'What are buckets good for?',p:`Segmenting data into groups of equal size:`,v:()=>L3(['Call','Meaning'],[['NTILE(4)','quartiles (top 25 %, next 25 % …)'],['NTILE(10)','deciles'],['NTILE(100)','percentiles'],['NTILE(3)','top / middle / bottom thirds'],['NTILE(2)','above / below the median']])}],
 q:{tbls:['results'],task:'Split students into <b>3 groups</b> by score (highest first) with <b>NTILE(3)</b>; show student, score and the group.',ex:'SELECT student, score, NTILE(2) OVER (ORDER BY score DESC) AS grp FROM results',ans:'SELECT student, score, NTILE(3) OVER (ORDER BY score DESC) AS grp FROM results',hint:'NTILE(3) OVER (ORDER BY score DESC)'}},
{t:'Practical Analytics',spell:'Usus Practicus',story:`Headmaster: "Theory is pleasant; recipes win tournaments. Here are the patterns analysts use every day."`,steps:[
 {h:'Recipe 1: Top-N per group',p:`Rank inside each group in a CTE, then keep <code>rn = 1</code> (or ≤ N). Why a CTE? You cannot put a window function in WHERE.`,v:()=>CODE(`WITH ranked AS (\n  SELECT student, house, score,\n         ROW_NUMBER() OVER (PARTITION BY house ORDER BY score DESC) AS rn\n  FROM results\n)\nSELECT student, house, score FROM ranked WHERE rn = 1;`)+`<div class="cap" id="rkx">…</div><div class="flex" style="align-items:flex-start"><div id="rk2"></div><div id="rk3"></div></div>`,i:()=>{const r=run('SELECT student, house, score, ROW_NUMBER() OVER (PARTITION BY house ORDER BY score DESC) AS rn FROM results'),fin=run('WITH ranked AS (SELECT student, house, score, ROW_NUMBER() OVER (PARTITION BY house ORDER BY score DESC) AS rn FROM results) SELECT student, house, score FROM ranked WHERE rn = 1');
  setTimeout(()=>{$('rkx').textContent='① The CTE numbers students inside each house';$('rk2').innerHTML=hcol(rt(r));chime(1)},600);
  setTimeout(()=>{$('rkx').textContent='② WHERE rn = 1 keeps one winner per house';[...document.querySelectorAll('#rk2 tr')].slice(1).forEach((t,k)=>t.classList.add(r.rows[k][3]==1?'keep':'drop'));chime(2)},2800);
  setTimeout(()=>{$('rk3').innerHTML=hcol(rt(fin));chime(3)},4400)}},
 {h:'Recipe 2: Month-over-month growth',p:`LAG fetches last month; subtract; drop the first row (no previous month) with <code>WHERE prev IS NOT NULL</code>.`,v:()=>CODE(`WITH t AS (\n  SELECT house, month, pts,\n         LAG(pts) OVER (PARTITION BY house ORDER BY m) AS prev\n  FROM points\n)\nSELECT house, month, pts - prev AS change\nFROM t WHERE prev IS NOT NULL;`)+rq('WITH t AS (SELECT house, month, pts, LAG(pts) OVER (PARTITION BY house ORDER BY m) AS prev FROM points) SELECT house, month, pts - prev AS change FROM t WHERE prev IS NOT NULL')},
 {h:'The analytics cookbook',p:`Match the question to the tool:`,v:()=>L3(['Question','Pattern'],[['Best N per group','ROW_NUMBER() + PARTITION BY + CTE, filter rn ≤ N'],['Leaderboard with ties','RANK() or DENSE_RANK()'],['Change vs previous period','LAG()'],['Cumulative totals','SUM() OVER (ORDER BY …)'],['Smooth a noisy series','AVG() OVER (… ROWS BETWEEN …)'],['Quartiles / deciles','NTILE()'],['Remove duplicates','ROW_NUMBER() per key, keep rn = 1']])}],
 q:{tbls:['results'],task:'Use a <b>CTE + ROW_NUMBER()</b> to show the <b>top-scoring student of each house</b> (student, house, score).',ex:'SELECT student, house, ROW_NUMBER() OVER (PARTITION BY house ORDER BY score DESC) AS rn FROM results',ans:'WITH ranked AS (SELECT student, house, score, ROW_NUMBER() OVER (PARTITION BY house ORDER BY score DESC) AS rn FROM results) SELECT student, house, score FROM ranked WHERE rn = 1',hint:'WITH ranked AS (… ROW_NUMBER() OVER (PARTITION BY house ORDER BY score DESC) AS rn …) SELECT … FROM ranked WHERE rn = 1'}},
{t:'CTE vs Nested Subqueries',spell:'Clarificatio',story:`Professor: "Both answer the same question. One makes you read inside-out like a Russian doll; the other reads like a recipe."`,steps:[
 {h:'Reading order: inside-out vs top-down',p:`Task: <i>students scoring above their own house average</i>. Left: nested derived table (read from the middle outwards). Right: CTE (read top to bottom). Watch the order your eyes must follow.`,v:()=>`<div class="flex" style="align-items:flex-start"><div style="flex:1;min-width:280px"><div class="cap">Nested 🙃</div><pre class="code">SELECT r.student\nFROM results r\nJOIN (<span id="n1">SELECT house, AVG(score) AS avg_score\n      FROM results GROUP BY house</span>) h\n  ON r.house = h.house\n<span id="n2">WHERE r.score &gt; h.avg_score</span></pre></div><div style="flex:1;min-width:280px"><div class="cap">CTE 🙂</div><pre class="code"><span id="c1">WITH house_avg AS (\n  SELECT house, AVG(score) AS avg_score\n  FROM results GROUP BY house\n)</span>\n<span id="c2">SELECT r.student\nFROM results r\nJOIN house_avg h ON r.house = h.house\nWHERE r.score &gt; h.avg_score</span></pre></div></div><div class="cap" id="nc">…</div>`,i:()=>{const hl=(id,on)=>$(id).style.cssText=on?'background:#e8c46a;color:#000;border-radius:4px':'';
  setTimeout(()=>{hl('n1',1);$('nc').textContent='Nested ① start in the MIDDLE (inner query)…';chime(1)},700);setTimeout(()=>{hl('n1',0);hl('n2',1);$('nc').textContent='Nested ② …then jump OUT to the filter';chime(1)},2600);
  setTimeout(()=>{hl('n2',0);hl('c1',1);$('nc').textContent='CTE ① first step: build house_avg (top)';chime(2)},4600);setTimeout(()=>{hl('c1',0);hl('c2',1);$('nc').textContent='CTE ② next step: use it. Straight down, no jumping!';chime(3)},6500)}},
 {h:'Same answer, clearer story',p:`The CTE <code>house_avg</code> is the labelled bottle; the main query compares each student with it. (The derived-table form is shown for reading only — this sandbox runs the CTE version.)`,v:()=>{const Q='WITH house_avg AS (SELECT house, AVG(score) AS avg_score FROM results GROUP BY house) SELECT r.student, r.house, r.score FROM results r JOIN house_avg h ON r.house = h.house WHERE r.score > h.avg_score',r=run(Q),bt=tb(DB.house_avg.rows,'','🧪 house_avg',[],DB.house_avg);return `<div class="flex" style="align-items:flex-start">${bt}<div style="font-size:30px;align-self:center">➜</div>${hcol(rt(r))}</div><div class="cap">Gryffindor avg 78.6 → Hermione, Harry, Neville · Slytherin avg 80 → Draco</div>`}},
